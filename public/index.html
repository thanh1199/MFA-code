<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MFAコード発番くん - Auto Mode</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; padding: 32px; background: #f4f6fa; color: #222; }
  .card { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 6px 24px rgba(0,0,0,0.06);}
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .ok { background: #d8f5e3; color: #157a3c; }
  .ng { background: #fde2e2; color: #a51919; }
  button { margin-top: 16px; padding: 10px 18px; border: none; border-radius: 8px; background: #2b6cff; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #ccc; }
  pre { background: #f8f9fb; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 320px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 MFAコード発番くん - Auto Mode</h1>
    <div class="sub">本アプリは自動運転モードで動作しています。UI操作は不要です。</div>

    <div id="status"></div>

    <button id="runNow">手動でスケジュールジョブを実行</button>
    <pre id="result"></pre>
  </div>

<script>
async function loadStatus() {
  const res = await fetch('/api/scheduled-job/status');
  const data = await res.json();
  document.getElementById('status').innerHTML = `
    <div class="row"><span>Salesforce 接続</span><span class="badge ${data.salesforceConnected ? 'ok' : 'ng'}">${data.salesforceConnected ? '接続中' : '未接続'}</span></div>
    <div class="row"><span>スケジューラ</span><span class="badge ${data.schedulerEnabled ? 'ok' : 'ng'}">${data.schedulerEnabled ? '有効' : '無効'}</span></div>
    <div class="row"><span>実行間隔</span><span>${data.intervalHours} 時間</span></div>
    <div class="row"><span>最終実行</span><span>${data.lastRunAt || '未実行'}</span></div>
    <div class="row"><span>次回予定</span><span>${data.nextRunAt || '-'}</span></div>
    <div class="row"><span>最終結果</span><span>${data.lastResult || '-'}</span></div>
  `;
}
document.getElementById('runNow').addEventListener('click', async () => {
  const btn = document.getElementById('runNow');
  btn.disabled = true; btn.textContent = '実行中...';
  try {
    const res = await fetch('/api/scheduled-job/run-now', { method: 'POST' });
    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    document.getElementById('result').textContent = String(e);
  } finally {
    btn.disabled = false; btn.textContent = '手動でスケジュールジョブを実行';
    loadStatus();
  }
});
loadStatus();
setInterval(loadStatus, 10000);
</script>
</body>
</html>
